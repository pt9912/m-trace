packages:
  - "apps/*"
  - "packages/*"

# Dependency-Build-Scripts (pnpm 11 `allowBuilds`, ersetzt das v10-
# `onlyBuiltDependencies`/`neverBuiltDependencies`). Ohne expliziten
# Eintrag bricht pnpm 11 mit `ERR_PNPM_IGNORED_BUILDS` ab. `esbuild`
# lief schon unter pnpm 10 ohne Postinstall (Binary via optionalDeps-
# Plattformpaket) — die Docker-Stages installieren ohnehin mit
# `--ignore-scripts`. `false` = Postinstall bewusst NICHT ausführen und
# den Befund quittieren (konsistent zur No-Build-Scripts-Haltung).
allowBuilds:
  esbuild: false

# Dependency-Overrides. Seit pnpm 11 werden Settings NICHT mehr aus dem
# `pnpm`-Feld in package.json gelesen (nur noch hier bzw. in .npmrc) —
# siehe https://pnpm.io/settings. Bei Migration/Erweiterung: pnpm-
# workspace.yaml ist die einzige Quelle.
overrides:
  picomatch: ^4.0.4
  devalue: ^5.8.1
  esbuild: ^0.28.1
  # undici <7.29.0: Cross-User Information Disclosure + Parse-Time-Crash
  # via degenerierte `private`-Cache-Direktiven (GHSA-4cwx-7wf7-3272,
  # HIGH; dazu vier moderate CRLF-/Cookie-/Desync-Advisories derselben
  # Serie). Nur transitiv via jsdom (reines devDep in der Vitest-DOM-
  # Umgebung, kein Runtime-Pfad). Fix in 7.29.0. Issues #19/#20.
  undici: ^7.29.0
  # brace-expansion <5.0.9: DoS via unbounded intermediate arrays —
  # umgeht die CVE-2026-14257-Mitigation (GHSA-rgw5-rvv9-x895, HIGH).
  # Dritte Nachschaerfung derselben Familie (Issue #15: <=5.0.5,
  # Issues #17/#18: <=5.0.7). Nur transitiv via eslint > minimatch
  # (reines devDep im Lint-Gate, kein Runtime-Pfad). Fix in 5.0.9.
  # Issues #19/#20.
  brace-expansion: ^5.0.9
  # fast-uri <3.1.5: Host-Confusion via Backslash-Authority-Introducer
  # (GHSA-7p8r-x3mc-p8w7, HIGH). Nachgeschaerftes Advisory zu Issue #16
  # (dort <=3.1.3, Pin ^3.1.4). Nur transitiv via @stryker-mutator/core
  # > ajv > fast-uri (reines devDep im Mutation-Gate, kein Runtime-Pfad).
  # Fix in 3.1.5. Issues #19/#20.
  fast-uri: ^3.1.5
  # nanoid <3.3.18: Custom-Generatoren laufen bei `size: 0` in eine
  # Endlosschleife -> DoS (GHSA-2v37-7h3g-55p8, HIGH). Nachgeschaerftes
  # Advisory zur <3.3.17-Fassung. Nur transitiv via eslint-plugin-svelte
  # > postcss (reines devDep im Lint-Gate, kein Runtime-Pfad); m-trace
  # ruft nanoid nirgends mit eigenem `size`-Argument auf. Fix in 3.3.18.
  # Issues #21-#29.
  nanoid: ^3.3.18
  # postcss <=8.5.17: Path Traversal beim Auto-Loading der Previous
  # Source Map (sourceMappingURL) -> Disclosure beliebiger .map-Dateien
  # (GHSA-r28c-9q8g-f849, HIGH). Nur transitiv via eslint-plugin-svelte
  # bzw. tsup (reine devDeps in Lint-/Build-Gates, kein Runtime-Pfad).
  # Fix in 8.5.18. Issues #17/#18.
  postcss: ^8.5.18

# Workspace-Pakete werden beim `pnpm deploy` in das Ziel-Bundle
# INJIZIERT statt als Symlink in den Workspace zu zeigen. Notwendig
# fuer die Runtime-Images: `pnpm deploy --prod --legacy` erzeugte in
# `/deploy/node_modules/@pt9912/<pkg>` einen Symlink nach
# `../../../workspace/packages/<pkg>`. Im Build-Stage ist der
# aufloesbar, im Runtime-Image wird aber nur `/deploy` kopiert — der
# Link zeigte dort ins Leere. Folge: das analyzer-service-Image war
# nicht startbar (`Cannot find module '@pt9912/stream-analyzer'`),
# das Dashboard ueberlebte nur, weil adapter-node die player-sdk
# schon zur Build-Zeit bundelt und zur Laufzeit nichts nachlaedt.
#
# pnpm nennt diesen Schalter selbst als Voraussetzung: "starting from
# pnpm v10, we only deploy from workspaces that have
# inject-workspace-packages=true" (ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE).
# `--legacy` war die Ausweich-Route um genau diese Anforderung herum
# und ist damit die Ursache, nicht die Loesung — die Dockerfiles
# deployen jetzt ohne das Flag.
#
# Preis: Workspace-Deps werden kopiert statt verlinkt. Aenderungen an
# `packages/*` brauchen dadurch einen erneuten Install, bevor sie in
# einem konsumierenden App-Paket sichtbar werden. Der Schalter steht
# ausserdem im Lockfile (`settings.injectWorkspacePackages`) — nach
# Aenderung ist `make lock-refresh` Pflicht, sonst bricht jeder
# `--frozen-lockfile`-Install mit ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
injectWorkspacePackages: true
