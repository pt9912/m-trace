# Dependabot haelt die Action-Referenzen in .github/workflows aktuell.
# Ohne diesen Kanal driftet der Bestand still: beim Aufsetzen dieser
# Datei lag jede einzelne Action genau eine Major zurueck, ohne dass ein
# Gate das gemeldet haette.
#
# Bewusst NUR `github-actions`. Das npm-Oekosystem bleibt aussen vor:
# Dependency-Hebungen laufen dort ueber Overrides in
# `pnpm-workspace.yaml` plus `make lock-refresh` (Docker-only, kein
# Host-`pnpm install`), und was wirklich gehoben werden muss, meldet der
# Nightly-Security-Audit als Issue. Ein zweiter, PR-basierter Kanal
# wuerde an beidem vorbeilaufen. Gleiches gilt fuer die Docker-
# Base-Images: die sind mit Absicht exakt gepinnt.
#
# Alle Actions landen in EINEM gruppierten PR pro Woche — Einzel-PRs pro
# Action waeren bei elf Workflows reines Rauschen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(ci)
    labels:
      - ci
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
